name: Deploy (GitHub Pages)

# Baut bei jeder Änderung auf main (auch aus dem CMS), jede Nacht (vergangene
# Termine verschwinden, neue freigegebene Profile erscheinen) und auf Zuruf von
# Supabase, wenn ein Profil geändert wurde (repository_dispatch, siehe docs/profile.md).
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  repository_dispatch:
    types: [profile-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # Repository → Settings → Secrets and variables → Actions → Variables
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.origin }}
          BASE_PATH: ${{ vars.BASE_PATH || steps.pages.outputs.base_path }}
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

    deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.nochmal.outputs.page_url }}
    steps:
      # GitHub Pages bleibt manchmal beim Übernehmen der Dateien hängen („syncing_files“, dann „Timeout reached“).
      # Darum länger warten (20 statt 10 Minuten) und bei einem Fehlschlag einmal neu versuchen.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 1200000
      - id: nochmal
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
